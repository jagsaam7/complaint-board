<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>BDA Nethravathi — Complaint Board Tracker</title>
<link rel="icon" id="favicon" type="image/png" href=""/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root{
  --paper:#F7F2E8;--paper-dark:#EDE4D0;--paper-mid:#F0E9D6;
  --ink:#1A2540;--ink-soft:#3B4A68;--ink-faint:#6B7A99;
  --brass:#9C6B1F;--brass-light:#C79A4B;--brass-pale:#F5EDD6;--line:#D8CBAA;
  --s-open:#C62828;--s-assigned:#E65100;--s-invest:#6A1B9A;
  --s-wip:#1565C0;--s-completed:#2E7D32;--s-closed:#37474F;
  --seal:#8B1A1A;
  --shadow-sm:0 1px 3px rgba(26,37,64,.08),0 1px 2px rgba(26,37,64,.04);
  --shadow-md:0 4px 16px rgba(26,37,64,.12),0 2px 6px rgba(26,37,64,.06);
  --shadow-lg:0 12px 40px rgba(26,37,64,.18),0 4px 12px rgba(26,37,64,.08);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--paper);background-image:radial-gradient(circle at 1px 1px,rgba(26,37,64,.045) 1px,transparent 0);background-size:20px 20px;color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;}
h1,h2,h3,h4,.serif{font-family:'Zilla Slab',serif;}
.mono{font-family:'IBM Plex Mono',monospace;}

/* ── VISITOR BAR ── */
.visitor-bar{background:var(--ink);color:rgba(247,242,232,.82);font-size:11px;padding:5px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--brass);}
.visitor-bar b{color:var(--brass-light);}
.vis-sep{opacity:.3;}

/* ── HEADER ── */
.ledger-header{background:var(--ink);color:var(--paper);border-bottom:5px double var(--brass-light);}
.crest{width:48px;height:48px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2.5px var(--brass-light),0 2px 8px rgba(0,0,0,.3);flex-shrink:0;}
.crest img{width:100%;height:100%;object-fit:cover;display:block;}

/* ── NAV TABS ── */
.nav-tab{padding:7px 16px;border-radius:999px;font-weight:600;font-size:13.5px;cursor:pointer;transition:all .18s;color:rgba(247,242,232,.65);border:1.5px solid transparent;}
.nav-tab:hover{color:var(--paper);border-color:rgba(247,242,232,.2);}
.nav-tab.active{background:var(--brass);color:#fff;border-color:var(--brass);}

/* ── CARD ── */
.card{background:#FFFDF7;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;left:0;top:18px;bottom:18px;width:4px;background:repeating-linear-gradient(to bottom,var(--line) 0 5px,transparent 5px 10px);border-radius:2px;}
.card-inner{padding:16px 16px 16px 20px;}

/* ── STAGE PILLS — solid fill, white text ── */
.sp{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:4px 12px;font-family:'Zilla Slab',serif;font-weight:700;letter-spacing:.07em;text-transform:uppercase;font-size:11.5px;color:#fff;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.18);}
.sp-Open            {background:var(--s-open);}
.sp-Assigned        {background:var(--s-assigned);}
.sp-Under_Investigation{background:var(--s-invest);}
.sp-Work_in_Progress{background:var(--s-wip);}
.sp-Completed       {background:var(--s-completed);}
.sp-Closed          {background:var(--s-closed);}

/* Timeline pill (same but slightly smaller) */
.tp{display:inline-flex;align-items:center;gap:4px;border-radius:5px;padding:3px 10px;font-family:'Zilla Slab',serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11px;color:#fff;}
.tp-Open{background:var(--s-open);}.tp-Assigned{background:var(--s-assigned);}.tp-Under_Investigation{background:var(--s-invest);}.tp-Work_in_Progress{background:var(--s-wip);}.tp-Completed{background:var(--s-completed);}.tp-Closed{background:var(--s-closed);}

/* Stage stat card */
.stage-stat{border-radius:10px;padding:14px 10px;text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s;border:2px solid transparent;}
.stage-stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.stage-stat .count{font-family:'Zilla Slab',serif;font-size:28px;font-weight:700;color:#fff;line-height:1;}
.stage-stat .lbl{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.85);margin-top:4px;}
.ss-open{background:var(--s-open);}.ss-assigned{background:var(--s-assigned);}.ss-invest{background:var(--s-invest);}.ss-wip{background:var(--s-wip);}.ss-completed{background:var(--s-completed);}.ss-closed{background:var(--s-closed);}

/* ── STAGE PROGRESS TRACK ── */
.stage-track{display:flex;align-items:flex-start;position:relative;margin:10px 0 2px;}
.stage-track::before{content:'';position:absolute;top:13px;left:12px;right:12px;height:2px;background:var(--line);z-index:0;}
.stage-step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;z-index:1;}
.sdot{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--ink-faint);transition:all .3s;}
.sdot.done{background:var(--s-completed);border-color:var(--s-completed);color:#fff;}
.sdot.cur-Open{background:var(--s-open);border-color:var(--s-open);color:#fff;box-shadow:0 0 0 3px rgba(198,40,40,.18);}
.sdot.cur-Assigned{background:var(--s-assigned);border-color:var(--s-assigned);color:#fff;box-shadow:0 0 0 3px rgba(230,81,0,.18);}
.sdot.cur-Under_Investigation{background:var(--s-invest);border-color:var(--s-invest);color:#fff;box-shadow:0 0 0 3px rgba(106,27,154,.18);}
.sdot.cur-Work_in_Progress{background:var(--s-wip);border-color:var(--s-wip);color:#fff;box-shadow:0 0 0 3px rgba(21,101,192,.18);}
.sdot.cur-Completed{background:var(--s-completed);border-color:var(--s-completed);color:#fff;}
.sdot.cur-Closed{background:var(--s-closed);border-color:var(--s-closed);color:#fff;}
.slbl{font-size:8.5px;font-weight:600;text-align:center;margin-top:3px;color:var(--ink-faint);line-height:1.25;max-width:54px;}

/* ── TIMELINE ── */
.tl-dot{width:13px;height:13px;border-radius:50%;flex-shrink:0;border:2.5px solid var(--paper);margin-top:2px;}
.tl-line{width:2px;background:var(--line);flex:1;min-height:20px;}

/* ── AVATAR ── */
.aring{border-radius:50%;padding:2px;background:linear-gradient(135deg,var(--brass-light),var(--brass));}
.aring img{border-radius:50%;display:block;background:#fff;}

/* ── LAST-SEEN BADGE ── */
.ls-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-family:'IBM Plex Mono',monospace;background:rgba(156,107,31,.10);border:1px solid rgba(156,107,31,.25);border-radius:4px;padding:2px 7px;color:var(--brass);}

/* ── BUTTONS ── */
.btn-ink{background:var(--ink);color:var(--paper);border-radius:8px;padding:9px 18px;font-weight:600;font-size:13.5px;border:none;cursor:pointer;font-family:'Inter',sans-serif;transition:opacity .15s,transform .12s;}
.btn-ink:hover{opacity:.88;transform:translateY(-1px);}
.btn-brass{background:var(--brass);color:#fff;border-radius:8px;padding:9px 18px;font-weight:600;font-size:13.5px;border:none;cursor:pointer;font-family:'Inter',sans-serif;transition:opacity .15s,transform .12s;}
.btn-brass:hover{opacity:.88;transform:translateY(-1px);}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:border-color .15s;}
.btn-ghost:hover{border-color:var(--brass);}
.btn-red{background:transparent;color:var(--s-open);border:1.5px solid var(--s-open);border-radius:8px;padding:7px 14px;font-weight:600;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;}
.btn-red:hover{background:var(--s-open);color:#fff;}
.btn-green{background:transparent;color:var(--s-completed);border:1.5px solid var(--s-completed);border-radius:8px;padding:7px 14px;font-weight:600;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;}
.btn-green:hover{background:var(--s-completed);color:#fff;}

/* ── INPUTS ── */
input,select,textarea{border:1.5px solid var(--line);background:#FFFDF7;border-radius:8px;padding:9px 13px;width:100%;font-family:'Inter',sans-serif;font-size:13.5px;color:var(--ink);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brass-light);border-color:var(--brass);background:#fff;}
label{font-size:12.5px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:5px;}

/* ── SEAL ── */
.seal-wrap{display:inline-block;transform:rotate(-8deg);filter:drop-shadow(0 2px 8px rgba(139,26,26,.35));}

/* ── CLOSED BANNER ── */
.closed-banner{background:linear-gradient(135deg,var(--s-closed),#546E7A);color:#fff;border-radius:8px;padding:10px 16px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;}

/* ── ANIMATIONS ── */
.fade-in{animation:fadeIn .22s ease both;}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
.skeleton{background:linear-gradient(90deg,var(--paper-dark) 25%,#fff 37%,var(--paper-dark) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;}
@keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}
@keyframes pulse-ring{0%,100%{box-shadow:0 0 0 3px rgba(21,101,192,.18);}50%{box-shadow:0 0 0 6px rgba(21,101,192,.06);}}

/* ── STATUS DOTS ── */
.dot-on{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--s-completed);box-shadow:0 0 0 2px rgba(46,125,50,.2);}
.dot-off{display:inline-block;width:9px;height:9px;border-radius:50%;background:#90A4AE;}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:8px;height:8px;}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

/* ── COMPLAINT CARD STATUS LEFT BORDER ── */
.ccb-Open{border-left:4px solid var(--s-open)!important;}
.ccb-Assigned{border-left:4px solid var(--s-assigned)!important;}
.ccb-Under_Investigation{border-left:4px solid var(--s-invest)!important;}
.ccb-Work_in_Progress{border-left:4px solid var(--s-wip)!important;}
.ccb-Completed{border-left:4px solid var(--s-completed)!important;}
.ccb-Closed{border-left:4px solid var(--s-closed)!important;}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;z-index:40;background:rgba(26,37,64,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;}
.modal-box{background:#FFFDF7;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);width:100%;margin:auto;}

/* Utility */
.divider{border:none;border-top:1px solid var(--line);margin:14px 0;}
.section-hd{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px;}
</style>

/* ── TURSO CLIENT ── */
function toArg(v){
  if(v==null) return{type:'null'};
  if(typeof v==='number') return Number.isInteger(v)?{type:'integer',value:String(v)}:{type:'float',value:v};
  return{type:'text',value:String(v)};
}
async function q(sql,args=[]){
  const r=await fetch(TURSO_URL+'/v2/pipeline',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+TURSO_TOKEN},
    body:JSON.stringify({requests:[{type:'execute',stmt:{sql,args:args.map(toArg)}},{type:'close'}]})
  });
  if(!r.ok) throw new Error('DB error HTTP '+r.status);
  const d=await r.json();
  const res=d.results[0];
  if(res.type==='error') throw new Error(res.error.message);
  const result=res.response.result;
  const cols=result.cols.map(c=>c.name);
  const rows=result.rows.map(row=>{const o={};row.forEach((c,i)=>{o[cols[i]]=c.value===undefined?null:c.value;});return o;});
  return{rows,lastInsertRowid:result.last_insert_rowid?Number(result.last_insert_rowid):null};
}

/* Normalises a SQLite-style "YYYY-MM-DD HH:MM:SS" or plain "YYYY-MM-DD"
   or already-ISO string into something `new Date()` can parse reliably. */
function toISO(d){
  if(!d) return null;
  if(d.includes('T')) return d;              // already ISO
  if(d.includes(' ')) return d.replace(' ','T')+'Z'; // "2026-08-09 12:30:00" (UTC from Turso) -> ISO
  return d+'T00:00:00';                        // plain date "2026-08-09"
}
function fmtDate(d){
  if(!d)return'—';
  try{
    const dt=new Date(toISO(d));
    if(isNaN(dt.getTime())) return d;
    return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
  }catch{return d;}
}
function fmtDT(d){
  if(!d)return'—';
  try{
    const dt=new Date(toISO(d));
    if(isNaN(dt.getTime())) return d;
    return dt.toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true});
  }catch{return d;}
}
function nowISO(){return new Date().toISOString();}

function stageTrack(currentStatus){

    const key=s.replace(/ /g,'_');
    let cls='sdot';
    if(i<idx) cls+=' done';
    else if(i===idx) cls+=` cur-${key}`;
    const mark=i<idx?'✓':(i===idx?'●':'');
    return`<div class="stage-step"><div class="${cls}">${mark}</div><div class="slbl">${stageLabel(s).replace(' ','<br>')}</div></div>`;
  }).join('')}</div>`;
}

/* ─────────────────────── COMPLAINT BOARD ─────────────────────── */
async function loadComplaints(){
  const main=document.getElementById('mainArea');
  try{
    const u=state.user;
    let sql=`SELECT c.*,u.full_name AS raised_by_name,u.avatar_seed AS raised_by_avatar,a.full_name AS assigned_to_name
             FROM complaints c
             JOIN users u ON u.id=c.raised_by
             LEFT JOIN users a ON a.id=c.assigned_to`;
    const args=[],where=[];
    /* Block captain: own block only. Resident/Owner-Tenant: own complaints only. */
    if(u.role==='block_captain'){where.push('c.block=?');args.push(u.block);}
    else if(u.role==='resident'){where.push('c.raised_by=?');args.push(u.id);}
    /* Status filter */
    if(state.filter.status){where.push('c.status=?');args.push(state.filter.status);}
    /* Block filter (only for roles that see all) */
    if(state.filter.block&&SEES_ALL.includes(u.role)){where.push('c.block=?');args.push(state.filter.block);}
    /* Type filter */
    if(state.filter.type){where.push('c.complaint_type=?');args.push(state.filter.type);}
    if(where.length) sql+=' WHERE '+where.join(' AND ');
    sql+=' ORDER BY c.created_at DESC';
    const{rows}=await q(sql,args);
    /* search filter in-memory */
    const search=(state.filter.search||'').toLowerCase();
    state.complaints=search?rows.filter(c=>c.title.toLowerCase().includes(search)||c.description.toLowerCase().includes(search)||c.ref_no.toLowerCase().includes(search)):rows;
    main.innerHTML=boardHtml();
    attachBoardEv();
  }catch(e){
    main.innerHTML=`<div class="card" style="padding:24px;color:var(--s-open);">${esc(e.message)}</div>`;
  }
}

      </div>`:''}
      <div id="ncErr" class="hidden" style="background:#fbe9e6;color:var(--s-open);border:1px solid var(--s-open);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px;"></div>
      <form id="ncForm">
        <div style="margin-bottom:14px;"><label>${t('titleField')}</label><input name="title" required maxlength="120" placeholder="e.g. Water leakage in Block A staircase"/></div>
        <div style="margin-bottom:14px;"><label>${t('descField')}</label><textarea name="description" required rows="4" placeholder="Describe the issue — when it started, severity, who is affected…"></textarea></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;">

          <select name="complaint_type" required>${TYPES.map(ty=>`<option value="${ty}">${TYPE_ICON[ty]||''} ${typeLabel(ty)}</option>`).join('')}</select></div>
        <div style="margin-bottom:14px;"><label>${t('dateField')}</label>
          <input name="issue_date" type="date" required value="${new Date().toISOString().slice(0,10)}" max="${new Date().toISOString().slice(0,10)}"/></div>
        <div style="margin-bottom:10px;"><label>${t('photoField')}</label>
          <input type="file" id="ncFile" accept="image/*,video/*" multiple/></div>
        <div style="margin-bottom:14px;"><label>${t('linkField')}</label>
          <input type="url" id="ncLink" placeholder="https://…"/></div>
        <div id="ncUpSt" style="font-size:12px;color:var(--ink-faint);margin-bottom:8px;"></div>
        <button type="submit" class="btn-brass" style="width:100%;" id="ncBtn">${t('fileComplaint')}</button>

    e.preventDefault();
    const errBox=document.getElementById('ncErr');errBox.classList.add('hidden');
    const btn=document.getElementById('ncBtn');btn.disabled=true;btn.textContent=t('filing');
    try{
      const fd=new FormData(e.target);
      const atts=await gatherAttachments(document.getElementById('ncFile'),document.getElementById('ncLink'),'ncUpSt');
      const block=fd.get('block');
      if(BLOCK_ROLES.includes(u.role)&&block!==u.block) throw new Error('You can only log complaints for your own block.');
      const ins=await q(
        `INSERT INTO complaints(ref_no,raised_by,title,description,block,flat_no,complaint_type,status,issue_date)VALUES('PENDING',?,?,?,?,?,?,'Open',?)`,
        [u.id,fd.get('title'),fd.get('description'),block,fd.get('flat_no'),fd.get('complaint_type'),fd.get('issue_date')]
      );
      const cid=ins.lastInsertRowid;
      const ref=`CBT-${new Date().getFullYear()}-${String(cid).padStart(4,'0')}`;
      await q('UPDATE complaints SET ref_no=? WHERE id=?',[ref,cid]);
      const upd=await q(`INSERT INTO complaint_updates(complaint_id,status,remarks,updated_by)VALUES(?,'Open','Complaint logged.',?)`,[cid,u.id]);
      for(const a of atts) await q('INSERT INTO attachments(update_id,file_type,file_url,file_name)VALUES(?,?,?,?)',[upd.lastInsertRowid,a.file_type,a.file_url,a.file_name]);

      /* Auto-assign: complaints raised by an Owner/Tenant default straight to
         their Block Captain, moving Open → Assigned automatically. */
      let assignNote='';
      if(u.role==='resident'){
        const cap=await q(`SELECT id,full_name FROM users WHERE role='block_captain' AND block=? AND is_active=1 LIMIT 1`,[block]);
        if(cap.rows.length){
          const capId=cap.rows[0].id,capName=cap.rows[0].full_name;
          await q(`UPDATE complaints SET status='Assigned',assigned_to=?,updated_at=datetime('now') WHERE id=?`,[capId,cid]);
          await q(`INSERT INTO complaint_updates(complaint_id,status,remarks,updated_by)VALUES(?,'Assigned',?,?)`,
            [cid,`Auto-assigned to Block ${block} Captain — ${capName}.`,u.id]);
          assignNote=` and assigned to Block ${block} Captain (${capName})`;
        }else{
          assignNote=' — no Block Captain is set up for this block yet; Admin will assign it manually';
        }
      }
      modal.innerHTML='';loadComplaints();toast(`Filed as ${ref}${assignNote}`);
    }catch(ex){errBox.textContent=ex.message;errBox.classList.remove('hidden');btn.disabled=false;btn.textContent=t('fileComplaint');}
  });
}

async function openDetail(id){
  const modal=document.getElementById('modalRoot');
  modal.innerHTML=`<div class="modal-bg"><div class="modal-box skeleton" style="max-width:700px;height:280px;margin:auto;"></div></div>`;
  try{
    const cr=await q(`SELECT c.*,u.full_name AS raised_by_name,u.avatar_seed AS raised_by_avatar,a.full_name AS assigned_to_name
      FROM complaints c JOIN users u ON u.id=c.raised_by LEFT JOIN users a ON a.id=c.assigned_to WHERE c.id=?`,[id]);
    const c=cr.rows[0];if(!c) throw new Error('Complaint not found.');
    const u=state.user;
    /* Access control */
    if(u.role==='block_captain'&&c.block!==u.block) throw new Error(`You can only view Block ${u.block} complaints.`);
    if(u.role==='resident'&&Number(c.raised_by)!==u.id) throw new Error('You can only view complaints you have raised yourself.');
    const ur=await q(`SELECT cu.*,u.full_name AS updated_by_name,u.role AS updated_by_role,u.avatar_seed AS updated_by_avatar
      FROM complaint_updates cu JOIN users u ON u.id=cu.updated_by WHERE cu.complaint_id=? ORDER BY cu.created_at ASC`,[id]);
    const updates=ur.rows;
    let attMap={};
    if(updates.length){
      const ph=updates.map(()=>'?').join(',');
      const ar=await q(`SELECT * FROM attachments WHERE update_id IN(${ph}) ORDER BY created_at ASC`,updates.map(x=>x.id));
      for(const a of ar.rows)(attMap[a.update_id]??=[]).push(a);
    }
    state.activeComplaint=c;
    state.activeHistory=updates.map(uu=>({...uu,attachments:attMap[uu.id]||[]}));
    renderDetail();
  }catch(ex){
    modal.innerHTML=`<div class="modal-bg"><div class="modal-box" style="max-width:480px;padding:28px;margin:auto;color:var(--s-open);">
      ${esc(ex.message)}<br/><br/><button class="btn-ghost" onclick="document.getElementById('modalRoot').innerHTML=''">Close</button></div></div>`;
  }
}

function openLightbox(url,type,filename){
  document.getElementById('lightboxOv')?.remove();
  const ov=document.createElement('div');
  ov.id='lightboxOv';ov.className='modal-bg';ov.style.zIndex='999';
  ov.innerHTML=`<div class="modal-box" style="max-width:min(92vw,820px);padding:14px;margin:auto;background:#14151b;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:12px;">
      <div style="font-size:12.5px;color:#fff;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">📎 ${filename||'Attachment'}</div>
      <div style="display:flex;gap:8px;flex-shrink:0;">
        <a href="${url}" download="${filename||'attachment'}" style="background:var(--brass);color:#fff;border-radius:8px;padding:7px 14px;font-weight:600;font-size:12.5px;text-decoration:none;">⬇ Download</a>
        <button id="lbClose" style="background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.4);border-radius:8px;padding:7px 14px;font-weight:600;font-size:12.5px;cursor:pointer;">✕ Close</button>
      </div>
    </div>
    ${type==='photo'
      ?`<img src="${url}" style="max-width:100%;max-height:75vh;display:block;margin:0 auto;border-radius:8px;"/>`
      :`<video src="${url}" controls autoplay playsinline style="max-width:100%;max-height:75vh;display:block;margin:0 auto;border-radius:8px;background:#000;"></video>`}
  </div>`;
  document.body.appendChild(ov);
  const prevOverflow=document.body.style.overflow;
  document.body.style.overflow='hidden';
  const close=()=>{ov.remove();document.body.style.overflow=prevOverflow;};
  document.getElementById('lbClose').addEventListener('click',close);
  ov.addEventListener('click',e=>{if(e.target===ov)close();});
  const onEsc=(e)=>{if(e.key==='Escape'){close();document.removeEventListener('keydown',onEsc);}};
  document.addEventListener('keydown',onEsc);
}

function attachUpdateEv(cid){
  document.getElementById('updForm')?.addEventListener('submit',async(e)=>{
    e.preventDefault();
    const errBox=document.getElementById('updErr');errBox.classList.add('hidden');
    const btn=document.getElementById('updBtn');btn.disabled=true;btn.textContent=t('saving');
    try{
      const fd=new FormData(e.target);
      const status=fd.get('status'),remarks=fd.get('remarks');
      if(!remarks.trim()) throw new Error('Please add a remark for this stage.');
      const c=state.activeComplaint;
      if(Number(c.is_closed)) throw new Error('This complaint is already closed — no further changes allowed.');
      /* Guard: stages must move forward strictly one step at a time — no skipping */
      if(STAGES.indexOf(status)!==STAGES.indexOf(c.status)+1)
        throw new Error('Stages must move forward one step at a time — no skipping ahead.');
      /* Guard: closed is irreversible and only Admin/President */
      if(status==='Closed'&&!CAN_CLOSE.includes(state.user.role))
        throw new Error('Only Admin or President can close a complaint permanently.');
      const atts=await gatherAttachments(document.getElementById('updFile'),document.getElementById('updLink'),'updUpSt');
      const extra=status==='Closed'?`,is_closed=1,closed_at=datetime('now')`:'';
      await q(`UPDATE complaints SET status=?,updated_at=datetime('now')${extra} WHERE id=?`,[status,cid]);
      const upd=await q('INSERT INTO complaint_updates(complaint_id,status,remarks,updated_by)VALUES(?,?,?,?)',[cid,status,remarks||null,state.user.id]);
      for(const a of atts) await q('INSERT INTO attachments(update_id,file_type,file_url,file_name)VALUES(?,?,?,?)',[upd.lastInsertRowid,a.file_type,a.file_url,a.file_name]);
      document.getElementById('modalRoot').innerHTML='';
      loadComplaints();
      toast(status==='Closed'?'✅ Complaint sealed and permanently closed!':`Moved to "${status}" successfully.`);
    }catch(ex){errBox.textContent=ex.message;errBox.classList.remove('hidden');btn.disabled=false;btn.textContent=t('saveStageUpdate');}
  });
}

/* ─────────────────────── FILE HELPER ─────────────────────── */
function fileToDataUrl(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});}
async function gatherAttachments(fileEl,linkEl,statusId){
  const statusEl=document.getElementById(statusId),out=[];
  for(const f of Array.from(fileEl?.files||[])){
    if(f.size>MAX_FILE){if(statusEl)statusEl.textContent=`⚠ ${f.name} exceeds 4MB — skipped.`;continue;}
    const url=await fileToDataUrl(f);
    out.push({file_url:url,file_name:f.name,file_type:f.type.startsWith('video')?'video':'photo'});
  }
  const link=linkEl?.value?.trim();
  if(link) out.push({file_url:link,file_name:'Linked file',file_type:/video|youtube|drive/.test(link)?'video':'photo'});
  return out;
}

          <span class="ls-badge" style="margin-left:6px;">📅 ${state.lang==='kn'?'ರಚಿಸಲಾಗಿದೆ':'Created'}: ${fmtDT(u.created_at)}</span>
        </div>
      </div>
      <!-- Actions -->
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;">
        <button class="btn-ghost" style="font-size:12px;padding:6px 11px;" data-edit="${u.id}" data-name="${esc(u.full_name)}" data-uname="${esc(u.username)}">${t('edit')}</button>
        <button class="btn-ghost" style="font-size:12px;padding:6px 11px;" data-reset="${u.id}" data-name="${esc(u.full_name)}">${t('resetPwd')}</button>
        <button class="${on?'btn-red':'btn-green'}" data-toggle="${u.id}" data-active="${u.is_active}" data-name="${esc(u.full_name)}">${on?t('disable'):t('enable')}</button>
        <button class="btn-red" data-delete="${u.id}" data-name="${esc(u.full_name)}">${t('delete')}</button>
      </div>
    </div>
  </div>`;
}

function attachAdminEv(){
  document.getElementById('newUserBtn').addEventListener('click',openNewUser);
  document.getElementById('clearClosedBtn').addEventListener('click',openClearClosed);

  document.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('click',()=>{
    openEditUsername(Number(el.dataset.edit),el.dataset.name,el.dataset.uname);
  }));

  document.querySelectorAll('[data-toggle]').forEach(el=>el.addEventListener('click',async()=>{
    const id=Number(el.dataset.toggle),on=Number(el.dataset.active)===1,name=el.dataset.name;
    if(id===state.user.id){toast("You can't disable your own account.",'warn');return;}
    if(!confirm(`${on?'Disable':'Enable'} account for "${name}"?`))return;
    await q('UPDATE users SET is_active=? WHERE id=?',[on?0:1,id]);
    toast(`Account "${name}" ${on?'disabled':'enabled'}.`);loadUsers();
  }));

  document.querySelectorAll('[data-reset]').forEach(el=>el.addEventListener('click',async()=>{
    const id=Number(el.dataset.reset),name=el.dataset.name;
    const pwd=prompt(`New temporary password for "${name}" (min 6 chars):`);
    if(!pwd)return;
    if(pwd.length<6){toast('Password must be at least 6 characters.','warn');return;}
    const h=dcodeIO.bcrypt.hashSync(pwd,10);
    await q('UPDATE users SET password_hash=? WHERE id=?',[h,id]);
    toast(`Password reset for "${name}". Share the new password securely.`);
  }));

  document.querySelectorAll('[data-delete]').forEach(el=>el.addEventListener('click',async()=>{
    const id=Number(el.dataset.delete),name=el.dataset.name;
    if(id===state.user.id){toast("You can't delete your own account.",'warn');return;}
    const raised=await q('SELECT COUNT(*) AS n FROM complaints WHERE raised_by=?',[id]);
    const updated=await q('SELECT COUNT(*) AS n FROM complaint_updates WHERE updated_by=?',[id]);
    const assigned=await q('SELECT COUNT(*) AS n FROM complaints WHERE assigned_to=?',[id]);
    if(Number(raised.rows[0].n)>0||Number(updated.rows[0].n)>0||Number(assigned.rows[0].n)>0){
      alert(`"${name}" has complaint records attached (raised, updated, or currently assigned).\n\nDeleting would corrupt the register.\n\nDisable the account instead — it prevents login while preserving all history.`);
      return;
    }
    if(!confirm(`Permanently delete account for "${name}"?\n\nThis cannot be undone.`))return;
    await q('DELETE FROM users WHERE id=?',[id]);
    toast(`Account for "${name}" deleted.`);loadUsers();
  }));
}

function openNewUser(){
  const modal=document.getElementById('adminModal');
  modal.innerHTML=`<div class="modal-bg" id="ov3">
    <div class="modal-box" style="max-width:480px;padding:28px;margin:auto;" class="fade-in">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
        <h3 style="font-family:'Zilla Slab',serif;font-size:20px;font-weight:700;">👤 New Account</h3>
        <button class="btn-ghost" id="closeNU" style="font-size:12px;padding:6px 12px;">✕ Close</button>
      </div>
      <div id="nuErr" class="hidden" style="background:#fbe9e6;color:var(--s-open);border:1px solid var(--s-open);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px;"></div>
      <form id="nuForm" style="display:grid;gap:13px;">
        <div><label>Full Name *</label><input name="full_name" required placeholder="e.g. Rajesh Kumar"/></div>
        <div><label>Username *</label><input name="username" id="nuUsername" required placeholder="e.g. block-a-captain (lowercase)"/>
          <div id="nuUnameHint" style="font-size:11.5px;margin-top:4px;color:var(--ink-faint);"></div>
        </div>
        <div><label>Temporary Password *</label><input name="password" required minlength="6" placeholder="At least 6 characters"/></div>
        <div><label>Role *</label>
          <select name="role" id="nuRole">
            <option value="resident">🏠 Owner / Tenant</option>
            <option value="block_captain">🏘️ Block Captain</option>
            <option value="president">🏛️ President</option>
            <option value="secretary">📋 Secretary</option>
            <option value="legal">⚖️ Legal &amp; Law</option>
            <option value="admin">🛡️ Administrator</option>
          </select>
        </div>
        <div id="nuBlockWrap" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div><label>Block *</label><select name="block">${BLOCKS.map(b=>`<option value="${b}">Block ${b}</option>`).join('')}</select></div>
          <div><label>Flat No.</label><select name="flat_no">${FLATS.map(f=>`<option>${f}</option>`).join('')}</select></div>
        </div>
        <div><label>Phone (optional)</label><input name="phone" placeholder="10-digit mobile number"/></div>
        <button type="submit" class="btn-brass" id="nuBtn">Create Account</button>
      </form>
    </div>
  </div>`;
  document.getElementById('closeNU').addEventListener('click',()=>modal.innerHTML='');
  document.getElementById('ov3').addEventListener('click',e=>{if(e.target.id==='ov3')modal.innerHTML='';});
  const roleEl=document.getElementById('nuRole'),bwrap=document.getElementById('nuBlockWrap');
  const syncBlock=()=>{bwrap.style.display=BLOCK_ROLES.includes(roleEl.value)?'grid':'none';};
  roleEl.addEventListener('change',syncBlock);syncBlock();

  /* Live username availability check — reuse is allowed once the old
     account with that username has been disabled or deleted. */
  let unameTimer=null;
  document.getElementById('nuUsername').addEventListener('input',(e)=>{
    const hint=document.getElementById('nuUnameHint');
    const uname=e.target.value.trim().toLowerCase();
    clearTimeout(unameTimer);
    if(!uname){hint.textContent='';return;}
    hint.textContent='Checking…';hint.style.color='var(--ink-faint)';
    unameTimer=setTimeout(async()=>{
      const r=await q('SELECT id,is_active FROM users WHERE username=?',[uname]);
      if(!r.rows.length){hint.textContent='✓ Available';hint.style.color='var(--s-completed)';return;}
      const row=r.rows[0];
      if(Number(row.is_active)===1){hint.textContent='✗ Already taken by an active account';hint.style.color='var(--s-open)';return;}
      const raised=await q('SELECT COUNT(*) AS n FROM complaints WHERE raised_by=?',[row.id]);
      const updated=await q('SELECT COUNT(*) AS n FROM complaint_updates WHERE updated_by=?',[row.id]);
      const assigned=await q('SELECT COUNT(*) AS n FROM complaints WHERE assigned_to=?',[row.id]);
      const hasHistory=Number(raised.rows[0].n)>0||Number(updated.rows[0].n)>0||Number(assigned.rows[0].n)>0;
      if(hasHistory){hint.textContent='✗ Used by a disabled account with complaint history — pick a different username';hint.style.color='var(--s-open)';}
      else{hint.textContent='ℹ️ Previously used by a disabled/removed account — free to reuse (will reactivate as a fresh account)';hint.style.color='var(--brass)';}
    },400);
  });

  document.getElementById('nuForm').addEventListener('submit',async(e)=>{
    e.preventDefault();
    const errBox=document.getElementById('nuErr');errBox.classList.add('hidden');
    const btn=document.getElementById('nuBtn');btn.disabled=true;btn.textContent='Creating…';
    try{
      const fd=new FormData(e.target);
      const uname=String(fd.get('username')).trim().toLowerCase();
      if(!uname) throw new Error('Username is required.');
      const dupe=await q('SELECT id,is_active FROM users WHERE username=?',[uname]);
      const role=fd.get('role');
      const isBlockRole=BLOCK_ROLES.includes(role);
      const h=dcodeIO.bcrypt.hashSync(fd.get('password'),10);
      if(dupe.rows.length){
        const row=dupe.rows[0];
        if(Number(row.is_active)===1) throw new Error('That username is already taken by an active account.');
        /* Safety: if the disabled account still has complaint history attached
           to its user id, reactivating (reusing) that same row would silently
           re-attribute that old history to the new person. Block reuse in
           that case — the record must stay tied to the original person. */
        const raised=await q('SELECT COUNT(*) AS n FROM complaints WHERE raised_by=?',[row.id]);
        const updated=await q('SELECT COUNT(*) AS n FROM complaint_updates WHERE updated_by=?',[row.id]);
        const assigned=await q('SELECT COUNT(*) AS n FROM complaints WHERE assigned_to=?',[row.id]);
        if(Number(raised.rows[0].n)>0||Number(updated.rows[0].n)>0||Number(assigned.rows[0].n)>0)
          throw new Error(`"${uname}" was used by a disabled account that still has complaint history attached — reusing it would misattribute those old records. Please choose a different username, or permanently delete that old account first (only possible once it has no complaint history).`);
        /* Username belongs to a disabled (or otherwise reusable) account.
           The DB enforces UNIQUE(username), so we reactivate that row with
           the fresh details instead of inserting a duplicate — it behaves
           exactly like a brand-new account (new password, new created date). */
        await q(`UPDATE users SET password_hash=?,full_name=?,role=?,block=?,flat_no=?,phone=?,avatar_seed=?,
                  is_active=1,last_seen=NULL,created_at=datetime('now') WHERE id=?`,
          [h,fd.get('full_name'),role,
           isBlockRole?fd.get('block'):null,
           isBlockRole?fd.get('flat_no'):null,
           fd.get('phone')||null,
           uname+'-'+Date.now(),
           row.id]);
        modal.innerHTML='';loadUsers();
        toast('Username was previously used by a disabled account — reactivated as a fresh account ✓');
        return;
      }
      await q(`INSERT INTO users(username,password_hash,full_name,role,block,flat_no,phone,avatar_seed)VALUES(?,?,?,?,?,?,?,?)`,
        [uname,h,fd.get('full_name'),role,
         isBlockRole?fd.get('block'):null,
         isBlockRole?fd.get('flat_no'):null,
         fd.get('phone')||null,
         uname+'-'+Date.now()]);
      modal.innerHTML='';loadUsers();toast('Account created successfully ✓');
    }catch(ex){errBox.textContent=ex.message;errBox.classList.remove('hidden');btn.disabled=false;btn.textContent='Create Account';}
  });
}

/* ─────────────────────── EDIT USERNAME ─────────────────────── */
function openEditUsername(id,name,currentUname){
  const u=state.users.find(x=>x.id===id);
  const currentFullName=u?u.full_name:name;
  const modal=document.getElementById('adminModal');
  modal.innerHTML=`<div class="modal-bg" id="ovEU">
    <div class="modal-box" style="max-width:440px;padding:28px;margin:auto;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
        <h3 style="font-family:'Zilla Slab',serif;font-size:20px;font-weight:700;">✏️ Edit Account</h3>
        <button class="btn-ghost" id="closeEU" style="font-size:12px;padding:6px 12px;">✕ Close</button>
      </div>
      <p style="font-size:12.5px;color:var(--ink-faint);margin-bottom:16px;">
        Editing name &amp; username for <b>${esc(currentFullName)}</b>. Everything else on the account stays the same.
      </p>
      <div id="euErr" class="hidden" style="background:#fbe9e6;color:var(--s-open);border:1px solid var(--s-open);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px;"></div>
      <form id="euForm" style="display:grid;gap:13px;">
        <div><label>Full Name *</label>
          <input name="full_name" id="euFullName" required value="${esc(currentFullName)}" placeholder="e.g. Rajesh Kumar"/>
        </div>
        <div><label>Username *</label>
          <input name="username" id="euUsername" required value="${esc(currentUname)}" placeholder="e.g. block-a-captain (lowercase)"/>
          <div id="euUnameHint" style="font-size:11.5px;margin-top:4px;color:var(--ink-faint);"></div>
        </div>
        <button type="submit" class="btn-brass" id="euBtn">💾 Save Changes</button>
      </form>
    </div>
  </div>`;
  document.getElementById('closeEU').addEventListener('click',()=>modal.innerHTML='');
  document.getElementById('ovEU').addEventListener('click',e=>{if(e.target.id==='ovEU')modal.innerHTML='';});

  const fullNameEl=document.getElementById('euFullName');
  const unameEl=document.getElementById('euUsername'),hint=document.getElementById('euUnameHint');
  let unameTimer=null,lastCheck={uname:null,ok:false};

  async function checkAvailability(uname){
    if(!uname){hint.textContent='';lastCheck={uname:null,ok:false};return;}
    if(uname===currentUname.toLowerCase()){hint.textContent='This is the current username.';hint.style.color='var(--ink-faint)';lastCheck={uname,ok:true};return;}
    hint.textContent='Checking…';hint.style.color='var(--ink-faint)';
    const r=await q('SELECT id,is_active FROM users WHERE username=?',[uname]);
    if(!r.rows.length){hint.textContent='✓ Available';hint.style.color='var(--s-completed)';lastCheck={uname,ok:true};return;}
    const row=r.rows[0];
    if(Number(row.is_active)===1){hint.textContent='✗ Already taken by an active account';hint.style.color='var(--s-open)';lastCheck={uname,ok:false};return;}
    const raised=await q('SELECT COUNT(*) AS n FROM complaints WHERE raised_by=?',[row.id]);
    const updated=await q('SELECT COUNT(*) AS n FROM complaint_updates WHERE updated_by=?',[row.id]);
    const assigned=await q('SELECT COUNT(*) AS n FROM complaints WHERE assigned_to=?',[row.id]);
    const hasHistory=Number(raised.rows[0].n)>0||Number(updated.rows[0].n)>0||Number(assigned.rows[0].n)>0;
    if(hasHistory){hint.textContent='✗ Used by a disabled account with complaint history — pick a different username';hint.style.color='var(--s-open)';lastCheck={uname,ok:false};}
    else{hint.textContent='ℹ️ Previously used by a disabled/removed account — free to reuse';hint.style.color='var(--brass)';lastCheck={uname,ok:true};}
  }
  unameEl.addEventListener('input',(e)=>{
    const uname=e.target.value.trim().toLowerCase();
    clearTimeout(unameTimer);
    unameTimer=setTimeout(()=>checkAvailability(uname),400);
  });

  document.getElementById('euForm').addEventListener('submit',async(e)=>{
    e.preventDefault();
    const errBox=document.getElementById('euErr');errBox.classList.add('hidden');
    const btn=document.getElementById('euBtn');btn.disabled=true;btn.textContent='Saving…';
    try{
      const fullName=fullNameEl.value.trim();
      const uname=unameEl.value.trim().toLowerCase();
      if(!fullName) throw new Error('Full Name cannot be empty.');
      if(!uname) throw new Error('Username cannot be empty.');
      if(uname!==lastCheck.uname||!lastCheck.ok){
        await checkAvailability(uname);
        if(uname!==lastCheck.uname||!lastCheck.ok) throw new Error('That username is not available. Please choose another.');
      }
      await q('UPDATE users SET username=?,full_name=? WHERE id=?',[uname,fullName,id]);
      modal.innerHTML='';loadUsers();
      const unameChanged=uname!==currentUname.toLowerCase(),nameChanged=fullName!==currentFullName;
      toast(unameChanged||nameChanged?'Account updated ✓':'No change made.');
    }catch(ex){errBox.textContent=ex.message;errBox.classList.remove('hidden');btn.disabled=false;btn.textContent='💾 Save Changes';}
  });
}

/* ─────────────────────── CLEAR OLD CLOSED COMPLAINTS ─────────────────────── */
function openClearClosed(){
  const modal=document.getElementById('adminModal');
  modal.innerHTML=`<div class="modal-bg" id="ovCC">
    <div class="modal-box" style="max-width:560px;padding:28px;margin:auto;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
        <h3 style="font-family:'Zilla Slab',serif;font-size:20px;font-weight:700;">🧹 Clear Old Closed Complaints</h3>
        <button class="btn-ghost" id="closeCC" style="font-size:12px;padding:6px 12px;">✕ Close</button>
      </div>
      <p style="font-size:12.5px;color:var(--ink-faint);margin-bottom:16px;">
        Permanently removes <b>Closed &amp; sealed</b> complaints (and all their stage history / attachments) older than the age you choose. Open, active, or recently-closed complaints are never touched.
      </p>
      <div style="display:grid;gap:12px;">
        <div>
          <label>Only purge complaints closed more than…</label>
          <select id="ccAge">
            <option value="30">30 days ago</option>
            <option value="60">60 days ago</option>
            <option value="90" selected>90 days ago</option>
            <option value="180">180 days ago</option>
            <option value="365">1 year ago</option>
            <option value="0">Any time (all closed complaints)</option>
          </select>
        </div>
        <div id="ccPreview" style="font-size:13px;color:var(--ink-soft);background:var(--paper-dark);border-radius:8px;padding:12px 14px;min-height:20px;">Loading preview…</div>
        <div id="ccList" style="max-height:180px;overflow-y:auto;display:grid;gap:5px;"></div>
        <div id="ccConfirmWrap" class="hidden">
          <label>Type <span class="mono" style="font-weight:700;">DELETE</span> to confirm permanent removal</label>
          <input id="ccConfirmText" placeholder="DELETE"/>
        </div>
        <div id="ccErr" class="hidden" style="background:#fbe9e6;color:var(--s-open);border:1px solid var(--s-open);border-radius:8px;padding:10px 14px;font-size:13px;"></div>
        <button class="btn-red" id="ccBtn" disabled style="opacity:.5;cursor:not-allowed;">🗑️ Permanently Delete</button>
      </div>
    </div>
  </div>`;
  document.getElementById('closeCC').addEventListener('click',()=>modal.innerHTML='');
  document.getElementById('ovCC').addEventListener('click',e=>{if(e.target.id==='ovCC')modal.innerHTML='';});

  let matched=[];
  async function refreshPreview(){
    const days=Number(document.getElementById('ccAge').value);
    const prev=document.getElementById('ccPreview'),listEl=document.getElementById('ccList'),btn=document.getElementById('ccBtn');
    prev.textContent='Loading preview…';listEl.innerHTML='';
    btn.disabled=true;btn.style.opacity='.5';btn.style.cursor='not-allowed';
    document.getElementById('ccConfirmWrap').classList.add('hidden');
    document.getElementById('ccConfirmText').value='';
    const sql=days>0
      ?`SELECT id,ref_no,title,block,flat_no,closed_at FROM complaints WHERE status='Closed' AND closed_at IS NOT NULL AND closed_at<=datetime('now',?) ORDER BY closed_at ASC`
      :`SELECT id,ref_no,title,block,flat_no,closed_at FROM complaints WHERE status='Closed' ORDER BY closed_at ASC`;
    const args=days>0?[`-${days} days`]:[];
    const r=await q(sql,args);
    matched=r.rows;
    if(!matched.length){
      prev.innerHTML=`✅ Nothing to clear — no closed complaints match this age range.`;
      return;
    }
    prev.innerHTML=`⚠️ <b>${matched.length}</b> closed complaint${matched.length===1?'':'s'} will be <b>permanently deleted</b>, including all stage history and attachments. This cannot be undone.`;
    listEl.innerHTML=matched.slice(0,25).map(c=>`<div style="font-size:12px;padding:6px 10px;background:var(--paper);border-radius:6px;border:1px solid var(--line);">
        <span class="mono" style="font-weight:700;">${c.ref_no}</span> — ${esc(c.title)} <span style="color:var(--ink-faint);">(Block ${c.block}-${c.flat_no}, sealed ${fmtDate(c.closed_at)})</span>
      </div>`).join('')+(matched.length>25?`<div style="font-size:12px;color:var(--ink-faint);padding:4px 10px;">…and ${matched.length-25} more</div>`:'');
    document.getElementById('ccConfirmWrap').classList.remove('hidden');
  }
  document.getElementById('ccAge').addEventListener('change',refreshPreview);
  refreshPreview();

  document.getElementById('ccConfirmText').addEventListener('input',(e)=>{
    const btn=document.getElementById('ccBtn');
    const ok=e.target.value.trim().toUpperCase()==='DELETE'&&matched.length>0;
    btn.disabled=!ok;btn.style.opacity=ok?'1':'.5';btn.style.cursor=ok?'pointer':'not-allowed';
  });

  document.getElementById('ccBtn').addEventListener('click',async()=>{
    const errBox=document.getElementById('ccErr');errBox.classList.add('hidden');
    const btn=document.getElementById('ccBtn');
    if(!matched.length)return;
    if(!confirm(`Final check: permanently delete ${matched.length} closed complaint${matched.length===1?'':'s'}? This cannot be undone.`))return;
    btn.disabled=true;btn.textContent='Deleting…';
    try{
      const ids=matched.map(c=>c.id);
      const ph=ids.map(()=>'?').join(',');
      await q(`DELETE FROM attachments WHERE update_id IN (SELECT id FROM complaint_updates WHERE complaint_id IN (${ph}))`,ids);
      await q(`DELETE FROM complaint_updates WHERE complaint_id IN (${ph})`,ids);
      await q(`DELETE FROM complaints WHERE id IN (${ph})`,ids);
      modal.innerHTML='';
      toast(`🧹 Cleared ${ids.length} old closed complaint${ids.length===1?'':'s'}.`);
      loadComplaints();
    }catch(ex){
      errBox.textContent=ex.message;errBox.classList.remove('hidden');
      btn.disabled=false;btn.textContent='🗑️ Permanently Delete';
    }
  });
}
